# Verifies main, and — where the network allows it — deploys.
#
# Deployment for globifytech.com is currently PULL-based: scripts/auto-deploy.sh
# runs from cron on the server, polls origin/main, and deploys when it moves.
# Hostinger's firewall drops GitHub-hosted runners, so the push-based job below
# stays switched off (see DEPLOY_MODE). What this workflow guarantees on every
# push is that main typechecks and lints — the server deploys whatever is on
# main, so a broken commit would otherwise be found by the cron, in production.
#
# The build never happens on the runner either way. `next build` pre-renders ~80
# pages by reading the database, which only accepts connections from the server
# itself (hPanel > Databases > Remote MySQL). A runner would be refused, every
# read would fall back, and the deploy would publish seed placeholders while
# reporting success. Building on the server is what keeps the pages real.
#
# Secrets below are needed only when DEPLOY_MODE=ssh — Settings > Secrets and
# variables > Actions:
#
#   SSH_HOST          hostname or IP of the server
#   SSH_USER          SSH username (hPanel > Advanced > SSH Access)
#   SSH_PRIVATE_KEY   private half of a key whose public half is in the
#                     server's ~/.ssh/authorized_keys. Generate a dedicated
#                     one: ssh-keygen -t ed25519 -C deploy -f deploy_key
#   SSH_KNOWN_HOSTS   output of: ssh-keyscan -p <port> <host>
#                     Pinning this is what stops a spoofed host from being
#                     handed the deploy key.
#   DEPLOY_PATH       absolute path to the checkout on the server,
#                     e.g. /home/u199249844/domains/globifytech.com/app
#
# Optional:
#   SSH_PORT          defaults to 22
#   SMOKE_URL         hit after restart; a non-200 fails the deploy

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the server is already on this commit'
        type: boolean
        default: false

# Deploys queue rather than race. `cancel-in-progress` stays false on purpose:
# interrupting a run mid-`npm ci` leaves the server with a broken node_modules.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck

      - run: npm run lint

  # Off unless the repository variable DEPLOY_MODE is set to "ssh".
  #
  # Hostinger's firewall drops GitHub-hosted runners, and allowlisting them means
  # 7,297 CIDR ranges that rotate — so this path cannot currently reach the
  # server, and leaving it enabled would mark every push red for a failure
  # nobody can act on. Deployment happens the other way round instead:
  # scripts/auto-deploy.sh polls origin/main from cron on the server.
  #
  # Everything here still works. If the firewall opens, or the site moves to a
  # host that accepts CI connections, set DEPLOY_MODE=ssh under Settings >
  # Secrets and variables > Actions > Variables and this resumes unchanged.
  deploy:
    name: Build and restart on the server
    needs: verify
    if: vars.DEPLOY_MODE == 'ssh'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check the deploy secrets are present
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_PATH; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "See the header of .github/workflows/deploy.yml for how to set them."
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # `ssh: connect to host *** port ***: Connection timed out` is the least
      # informative way this can fail: the values are masked, so the log cannot
      # say whether the secrets are wrong or the server refused the runner. This
      # step reaches the same conclusion the masking prevents, by probing two
      # reference endpoints alongside the configured one and reporting only
      # reachable/unreachable — never the values themselves.
      - name: Check the server is reachable
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          probe() { timeout 12 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null; }

          if probe "$SSH_HOST" "$SSH_PORT"; then
            echo "Configured SSH endpoint is reachable."
            exit 0
          fi

          echo "Configured SSH endpoint did NOT accept a TCP connection."
          echo "Classifying the failure against two reference endpoints:"

          # github.com:22 establishes whether this runner can open outbound SSH
          # at all. 147.93.93.190:65002 is globifytech.com's server — the address
          # ftp.globifytech.com resolves to, publicly in DNS, verified answering
          # with an OpenSSH 9.9 banner. Between them the cause is unambiguous.
          probe github.com 22 && outbound=yes || outbound=no
          probe 147.93.93.190 65002 && server=yes || server=no
          echo "  outbound SSH from this runner : $outbound"
          echo "  globifytech.com server        : $server"

          if [ "$outbound" = no ]; then
            echo "::error::This runner cannot open outbound SSH at all — a GitHub incident, not your configuration."
          elif [ "$server" = yes ]; then
            echo "::error::The server is reachable from this runner, but SSH_HOST/SSH_PORT are not. \
          One of those two secrets is wrong. SSH_HOST must be 147.93.93.190 (the origin), \
          NOT 145.79.29.41 or 145.79.24.8 — those are Hostinger CDN addresses that run no SSH. \
          SSH_PORT must be 65002; port 22 is filtered on this host and times out exactly like this."
          else
            echo "::error::The server refuses connections from GitHub's runners specifically — it \
          answers from other networks but drops this one. Hostinger is filtering the runner IP range. \
          Ask Hostinger support to allow it, or switch to the pull-based deploy (a cron on the server \
          that polls origin/main), which needs no inbound access."
          fi
          exit 1

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SMOKE_URL: ${{ secrets.SMOKE_URL }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              "$SSH_USER@$SSH_HOST" \
              "cd '$DEPLOY_PATH' \
               && DEPLOY_BRANCH=main \
                  DEPLOY_FORCE='$FORCE' \
                  DEPLOY_SMOKE_URL='$SMOKE_URL' \
                  bash scripts/deploy.sh"

      - name: Remind about the CDN
        if: success()
        run: |
          {
            echo "### Deployed to globifytech.com"
            echo
            echo "The server is running \`${GITHUB_SHA:0:7}\`."
            echo
            echo "**Purge the CDN before checking the site.** Hostinger's edge holds"
            echo "pages for up to a year (\`s-maxage=31536000\`), so the old HTML will"
            echo "keep being served until you clear it:"
            echo
            echo "hPanel → Websites → globifytech.com → Performance → **Purge Cache**"
          } >> "$GITHUB_STEP_SUMMARY"
